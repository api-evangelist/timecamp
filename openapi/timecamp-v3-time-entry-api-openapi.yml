                      nullable: true
                    user:
                      type: object
                      description: Related user data
                      nullable: true
                      properties:
                        id:
                          type: integer
                          description: User id
                          example: 1
                        email:
                          type: string
                          description: User email
                          example: john.doe@example.com
                        display_name:
                          type: string
                          description: User display name
                          example: John Doe
                    task:
                      type: object
                      description: Related task data
                      nullable: true
                      properties:
                        id:
                          type: number
                          description: Task id
                          example: 1
                        name:
                          type: string
                          description: Task name
                          example: My task
                        color:
                          type: string
                          description: Task color
                          example: '#000000'
                        billable:
                          type: boolean
