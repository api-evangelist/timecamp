  /v3/time-entries/create:
    post:
      summary: Create time entry
      description: Create a time entry.
      tags:
      - '[v3] Time Entry'
      operationId: create-time-entry
      security:
      - api_key_in_header: []
      parameters:
      - schema:
          type: string
          example: application/json
        in: header
        name: Accept
      - schema:
          type: string
          example: tc_web
        in: header
        name: Tc-service
        description: Optional service name used for activity and analytics context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - date
              properties:
                date:
                  type: string
                  format: date
                  example: '2026-06-18'
                startTime:
                  type: string
                  example: 09:00:00
                endTime:
                  type: string
                  example: '10:00:00'
                duration:
                  type: integer
                  format: int32
                  description: Duration in seconds. If omitted, duration is calculated from start and end.
                  example: 3600
                taskId:
                  type: integer
                  format: int32
                  example: 123
                externalTaskId:
                  type: string
                  example: card_123
                assignedUserId:
                  type: integer
                  format: int32
                  example: 456
                userEmail:
                  type: string
                  format: email
                  example: user@example.com
                taskNameSearch:
                  type: string
                  example: Project task
                note:
                  type: string
                  example: Work note
                description:
                  type: string
                  example: Work note
                customId:
                  type: string
                  example: EXT-123
                billable:
                  type: boolean
                  example: true
                tags:
                  type: array
                  items:
                    oneOf:
                    - type: integer
                    - type: object
                      properties:
                        tagId:
                          type: integer
                baseEntryId:
                  type: integer
                  format: int32
                  example: 100
                place:
                  type: string
                  example: timesheet
            examples:
              Create:
                value:
                  date: '2026-06-18'
                  startTime: 09:00:00
                  endTime: '10:00:00'
                  taskId: 123
                  note: Work note
                  billable: true
      responses:
        '201':
          description: Time entry created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int32
                        example: 123
                      duration:
                        type: integer
                        format: int32
                        example: 3600
                      userId:
                        type: integer
                        format: int32
                        example: 456
                      taskId:
                        type: integer
                        format: int32
                        example: 123
                      date:
                        type: string
                        format: date
                        example: '2026-06-18'
                      startTime:
                        type: string
                        example: 09:00:00
                      endTime:
                        type: string
                        example: '10:00:00'
                      description:
                        type: string
                        nullable: true
                        example: Work note
                      billable:
                        type: boolean
                        example: true
                      tags:
                        type: array
                        nullable: true
                        items:
                          type: integer
                          format: int32
                          example: 7
                  meta:
                    type: object
                    properties:
                      tags:
                        type: array
                        description: Tag metadata for tags assigned to the created time entry.
                        items:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                              format: int32
                              example: 7
                            name:
                              type: string
                              example: My tag
              examples:
                Success Response:
                  value:
                    data:
                      id: 123
                      duration: 3600
                      userId: 456
                      taskId: 123
                      date: '2026-06-18'
                      startTime: 09:00:00
                      endTime: '10:00:00'
                      description: Work note
                      billable: true
                      tags:
                      - 7
                    meta:
                      tags:
                      - id: 7
                        name: My tag
        '400':
          description: Invalid request payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v3/time-entries/{id}:
    put:
      summary: Update time entry
      description: Update a time entry by id.
      tags:
      - '[v3] Time Entry'
      operationId: update-time-entry
      security:
      - api_key_in_header: []
      parameters:
      - schema:
          type: string
          example: application/json
        in: header
        name: Accept
      - schema:
          type: string
          example: tc_web
        in: header
        name: Tc-service
        description: Optional service name used for activity and analytics context.
      - schema:
          type: integer
          minimum: 1
          example: 123
        in: path
        required: true
        name: id
        description: Time entry id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                date:
                  type: string
                  format: date
                  example: '2026-06-18'
                startTime:
                  type: string
                  example: 09:00:00
                endTime:
                  type: string
                  example: '10:00:00'
                duration:
                  type: integer
                  format: int32
                  description: Duration in seconds.
                  example: 3600
                increase:
                  type: boolean
                  description: When true, adds duration to the current time entry duration instead of replacing it.
                  example: false
                note:
                  type: string
                  description: Time entry note. Takes precedence over description when both are provided.
                  example: Updated work note
                description:
                  type: string
                  description: Time entry description. Used when note is not provided.
                  example: Updated work note
                billable:
                  type: boolean
                  example: true
                invoiceId:
                  type: integer
                  format: int32
                  example: 44
                taskId:
                  type: integer
                  format: int32
                  example: 123
                analyticsPlace:
                  type: string
                  example: report_detailed
                analyticsElement:
                  type: string
                  example: duration
            examples:
              Update:
                value:
                  date: '2026-06-18'
                  startTime: 09:00:00
                  endTime: '10:00:00'
                  duration: 3600
                  increase: false
                  taskId: 123
                  note: Updated work note
                  billable: true
      responses:
        '200':
          description: Time entry updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      entry_id:
                        type: integer
                        format: int32
                        example: 123
                      task_id:
                        type: integer
                        format: int32
                        example: 456
                      time_span:
                        type: integer
                        format: int32
                        description: Duration in seconds.
                        example: 3600
                      user_id:
                        type: integer
                        format: int32
                        example: 789
                      date:
                        type: string
                        format: date
                        example: '2026-06-18'
                      start_time_hour:
                        type: string
                        example: 09:00:00
                      end_time_hour:
                        type: string
                        example: '10:00:00'
                      note:
                        type: string
                        nullable: true
                        example: Updated work note
                      billable:
                        type: boolean
                        example: true
                      invoiceId:
                        type: integer
                        format: int32
                        example: 44
                      color:
                        type: string
                        nullable: true
                        example: '#4DC2E8'
                      tags:
                        type: array
                        items:
                          type: integer
                          format: int32
                          example: 7
                  meta:
                    type: object
                    properties:
                      tags:
                        type: array
                        description: Tag metadata for tags assigned to the updated time entry.
                        items:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                              format: int32
                              example: 7
                            name:
                              type: string
                              example: My tag
              examples:
                Success Response:
                  value:
                    data:
                      entry_id: 123
                      task_id: 456
                      time_span: 3600
                      user_id: 789
                      date: '2026-06-18'
                      start_time_hour: 09:00:00
                      end_time_hour: '10:00:00'
                      note: Updated work note
                      billable: true
                      invoiceId: 44
                      color: '#4DC2E8'
                      tags:
                      - 7
                    meta:
                      tags:
                      - id: 7
                        name: My tag
        '400':
          description: Invalid request payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                Bad Request:
                  value:
                    message: unrecognized date or time format
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                Forbidden:
                  value:
                    message: You do not have permission to update this time entry.
        '404':
          description: Time entry not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                Not Found:
                  value:
                    message: No entry found
      x-internal: false
    delete:
      summary: Delete time entry
      description: Delete a time entry by id.
      tags:
      - '[v3] Time Entry'
      operationId: delete-time-entry
      parameters:
      - schema:
          type: string
          example: application/json
        in: header
        name: Accept
      - schema:
          type: string
          example: tc_web
        in: header
        name: Tc-service
        description: Optional service name used for activity and analytics context.
      - schema:
          type: integer
          minimum: 1
          example: 123
        in: path
        required: true
        name: id
        description: Time entry id.
      - schema:
          type: string
          example: report_detailed
        in: query
        required: false
        name: source
        description: Optional UI source for analytics context.
      - schema:
          type: string
          example: tracked_time
        in: query
        required: false
        name: element
        description: Optional UI element for analytics context.
      responses:
        '200':
          description: Time entry deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: removed
              examples:
                Success Response:
                  value:
                    message: removed
        '204':
          description: Time entry does not exist or was already deleted.
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                Forbidden:
                  value:
                    message: You do not have permission to delete this time entry.
      x-internal: false
      security:
      - api_key_in_header: []
components:
  securitySchemes:
    api_key_in_header:
      type: http
      scheme: bearer
      description: ''
