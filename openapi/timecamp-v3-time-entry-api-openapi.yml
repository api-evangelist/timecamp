                    tags:
                      type: array
                      description: Related tags data
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Tag id
                            example: 1
                          name:
                            type: string
                            description: Tag name
                            example: My first tag
                          tag_list:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Tag list id
                                example: 1
                              name:
                                type: string
                                description: Tag list name
                                example: Tag list
                  required:
                  - id
                  - duration
                  - invoice_id
                  - last_modify
                  - date
                  - start_time
                  - end_time
                  - billable
                  - user
                  - task
                  - tags
              examples:
                'Example #1':
                  value:
                  - id: 1
                    duration: 4210
                    invoice_id: 0
                    last_modify: '2022-01-01 14:28:30'
                    date: '2022-01-01'
                    start_time: '10:54'
                    end_time: '12:28'
                    billable: true
                    description: null
                    user:
                      id: 1
                      email: john.doe@timecamp.com
                      display_name: John Doe
                    task:
                      id: 1
                      name: First task
                      color: '#4DC2E8'
                      billable: true
                    tags:
                    - id: 1
                      name: My first tag
                      tag_list:
                        id: 1
                        name: My tag list
                'Example #2':
                  value:
                  - id: 2
                    duration: 900
                    invoice_id: 0
                    last_modify: '2022-01-01 16:00:00'
                    date: '2022-01-01'
                    start_time: '13:00'
                    end_time: '13:15'
                    billable: true
                    description: null
                    user:
                      id: 1
                      email: john.doe@timecamp.com
                      display_name: John Doe
                    task: null
                    tags: []
                'Example #3':
                  value: []
          headers:
            Content-Type:
              schema:
                type: string
              description: application/json
      tags:
      - '[v3] Time Entry'
