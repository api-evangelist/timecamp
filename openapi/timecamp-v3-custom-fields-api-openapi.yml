        required: true
        name: resourceType
      - schema:
          type: integer
          example: 1
        in: path
        required: true
        name: resourceId
      responses:
        '200':
          description: Custom Fields values for the resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        templateId:
                          type: integer
