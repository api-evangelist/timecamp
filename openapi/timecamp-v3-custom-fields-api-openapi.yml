                          example: In Progress
              examples:
                Success Response:
                  value:
                    data:
                    - templateId: 66
                      name: Client Status
                      resourceType: user
                      required: true
                      fieldType: string
                      defaultValue: In Progress
                      value: In Progress
                    - templateId: 69
                      name: Progress
                      resourceType: user
                      required: false
                      fieldType: number
                      defaultValue: null
