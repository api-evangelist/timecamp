      - schema:
          type: string
          example: application/json
        in: header
        name: Accept
      - schema:
          type: string
          example: application/json
        in: header
        name: Content-Type
      - schema:
          type: integer
          example: 1
        in: path
        required: true
        name: templateId
      - schema:
          type: integer
          example: 1
        in: path
        required: true
        name: resourceId
      responses:
        '200':
